<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración | Gobree Belt</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .admin-container {
      max-width: 800px;
      margin: 4rem auto;
      padding: 2rem;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .image-list {
      margin-top: 2rem;
      display: grid;
      gap: 1rem;
    }
    .image-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
    }
    .image-item img {
      width: 100px;
      height: 60px;
      object-fit: cover;
      border-radius: 0.3rem;
    }
    .image-item-info {
      flex-grow: 1;
    }
    .admin-form {
      display: grid;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 2px solid var(--surface-soft);
    }
    .btn-danger {
      background: #ef4444;
      color: white;
    }
    .btn-success {
      background: #22c55e;
      color: white;
    }
  </style>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <div class="admin-container">
    <h1>Gestión del Carrusel</h1>
    <p>Agrega, ordena o quita imágenes del carrusel del inicio. Los cambios se guardan en el servidor.</p>

    <div class="admin-form" style="border-bottom: 0; padding-bottom: 0; margin-bottom: 1.25rem;">
      <label>
        Contraseña del panel
        <input type="password" id="adminPassword" placeholder="Contraseña">
      </label>
      <div style="display:flex; gap:.75rem; flex-wrap:wrap;">
        <button class="btn" id="loginBtn">Iniciar sesión</button>
        <button class="btn btn-secondary" id="logoutBtn">Cerrar sesión</button>
      </div>
      <p id="authStatus" style="margin:0; color: var(--muted); font-size: .95rem;"></p>
    </div>
    
    <div class="admin-form">
      <label>
        URL de la imagen (ej: portadagobree.png o una URL externa)
        <input type="text" id="imgUrl" placeholder="Ruta de la imagen">
      </label>
      <label>
        Texto descriptivo (Alt)
        <input type="text" id="imgAlt" placeholder="Ej: Banda transportadora en planta">
      </label>
      <button class="btn btn-success" id="addBtn">Agregar al Carrusel</button>
    </div>

    <h2>Imágenes Actuales</h2>
    <div id="imageList" class="image-list"></div>

    <div style="margin-top: 3rem; padding-top: 2rem; border-top: 2px solid var(--surface-soft);">
      <h3>Finalizar Cambios</h3>
      <p>Guarda para aplicar los cambios al carrusel del inicio.</p>
      <button class="btn" id="saveBtn">Guardar en el sitio</button>
      <a href="/" class="btn btn-secondary">Ver Inicio</a>
    </div>
  </div>

  <script>
    const imageList = document.getElementById('imageList');
    const imgUrl = document.getElementById('imgUrl');
    const imgAlt = document.getElementById('imgAlt');
    const addBtn = document.getElementById('addBtn');
    const saveBtn = document.getElementById('saveBtn');
    const adminPassword = document.getElementById('adminPassword');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const authStatus = document.getElementById('authStatus');

    let currentImages = [];

    function setStatus(text) {
      authStatus.textContent = text || '';
    }

    function renderList() {
      imageList.innerHTML = currentImages.map((img, index) => `
        <div class="image-item">
          <img src="${img.url}" alt="${img.alt}">
          <div class="image-item-info">
            <strong>${img.url}</strong><br>
            <small>${img.alt}</small>
          </div>
          <div style="display:flex; gap:.5rem; flex-wrap:wrap; justify-content:flex-end;">
            <button class="btn btn-secondary" onclick="moveImage(${index}, -1)">↑</button>
            <button class="btn btn-secondary" onclick="moveImage(${index}, 1)">↓</button>
            <button class="btn btn-danger" onclick="removeImage(${index})">Eliminar</button>
          </div>
        </div>
      `).join('');
    }

    window.removeImage = (index) => {
      currentImages.splice(index, 1);
      renderList();
    };

    window.moveImage = (index, dir) => {
      const next = index + dir;
      if (next < 0 || next >= currentImages.length) return;
      const tmp = currentImages[index];
      currentImages[index] = currentImages[next];
      currentImages[next] = tmp;
      renderList();
    };

    addBtn.addEventListener('click', () => {
      if (!imgUrl.value) return alert('Por favor ingresa la URL de la imagen');
      currentImages.push({
        url: imgUrl.value,
        alt: imgAlt.value || 'Gobree Belt'
      });
      imgUrl.value = '';
      imgAlt.value = '';
      renderList();
    });

    loginBtn.addEventListener('click', async () => {
      setStatus('Iniciando sesión...');
      try {
        const r = await fetch('/api/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ password: adminPassword.value || '' })
        });
        if (!r.ok) throw new Error('login_failed');
        setStatus('Sesión iniciada.');
      } catch (e) {
        setStatus('No se pudo iniciar sesión. Revisa la contraseña.');
      }
    });

    logoutBtn.addEventListener('click', async () => {
      setStatus('Cerrando sesión...');
      try {
        await fetch('/api/admin-logout', { method: 'POST', credentials: 'same-origin' });
        setStatus('Sesión cerrada.');
      } catch (e) {
        setStatus('Sesión cerrada.');
      }
    });

    saveBtn.addEventListener('click', async () => {
      try {
        const r = await fetch('/api/hero', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ images: currentImages })
        });
        if (r.status === 401) {
          alert('Necesitas iniciar sesión para guardar.');
          return;
        }
        if (!r.ok) throw new Error('save_failed');
        alert('Guardado. El carrusel del inicio se actualiza automáticamente.');
      } catch (e) {
        alert('No se pudo guardar. Intenta de nuevo.');
      }
    });

    (async () => {
      try {
        const r = await fetch('/api/hero', { cache: 'no-store' });
        const data = await r.json();
        currentImages = Array.isArray(data.images) ? data.images : [];
      } catch (e) {
        currentImages = [
          { url: 'portadagobree.png', alt: 'Línea industrial con bandas transportadoras' },
          { url: 'IndustriaAlimenticia.png', alt: 'Aplicación de bandas en industria alimenticia' },
          { url: 'Logistica.png', alt: 'Sistema de bandas para logística y distribución' }
        ];
      }
      renderList();
    })();
  </script>
</body>
</html>
